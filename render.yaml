# Render Blueprint: the always-on trading backend (API + worker) built from ./Dockerfile.
#
# Phone-friendly deploy: Render dashboard -> New -> Blueprint -> pick this GitHub repo -> Render shows
# the two prompts below (DATABASE_URL, ADMIN_PASSWORD) -> Apply. Step by step: docs/SUBAH_DEPLOY_HINGLISH.md.
#
# NOT RUN: this file was written from memory of Render's Blueprint spec and checked only for YAML
# syntax. If the Render dashboard reports a field error, fix that field there (or create the service
# by hand: New -> Web Service -> Docker, same env vars as listed below).
#
# PLAN / COST: `starter` is the smallest always-on paid web service (about US$7 per month at the time of
# writing, check Render's current pricing). Do NOT switch to `free`: free web services go to sleep
# after ~15 minutes without inbound traffic, and a sleeping service means a stopped trading bot.
#
# This file creates ONLY the backend. The dashboard is a separate Vercel project (Root Directory
# apps/web), and the database is an external managed Postgres (Neon / Supabase / Render Postgres):
# paste its connection string when Render asks for DATABASE_URL.
#
# Outbound IP for Delta's API-key whitelist (needed only for Live): Render dashboard -> your service
# -> Connect -> Outbound. Those addresses are shared by every Render service in the region.
services:
  - type: web
    name: cryptoalgo-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore # near Delta's data centre
    healthCheckPath: /api/health
    numInstances: 1 # NEVER scale out: exactly one worker may trade
    envVars:
      - key: NODE_ENV
        value: production

      # ---- generated by Render once, kept across deploys. Read PROXY_SHARED_SECRET afterwards
      #      (service -> Environment) and paste the SAME value into Vercel.
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY # encrypts the Delta API key you later save in the dashboard
        generateValue: true
      - key: PROXY_SHARED_SECRET # the Vercel dashboard sends it on every request; direct callers get 403
        generateValue: true

      # ---- Render asks you for these two when you apply the Blueprint (they are never stored in git)
      - key: DATABASE_URL # Neon / Supabase / Render Postgres connection string (starts with postgresql://)
        sync: false
      - key: ADMIN_PASSWORD # dashboard login password, at least 12 characters (hashed at startup)
        sync: false

      # ---- behaviour
      - key: DELTA_ENV
        value: production # Delta Exchange India. Demo mode only reads PUBLIC market data from it.
      - key: MARKET_DATA_SOURCE
        value: delta
      # Live trading stays OFF until you arm it yourself in the dashboard (Live tab -> activation
      # workflow, it needs an API key, a whitelisted IP and typed confirmations). "false" here only
      # means the deployment ALLOWS that workflow; set it to "true" for a hard lock that no dashboard
      # click can override (recommended until you have finished docs/GO_LIVE_CHECKLIST.md).
      - key: LIVE_HARD_DISABLE
        value: "false"
      - key: BOT_AUTOSTART
        value: "true" # starts the simulated (Demo) bot on a fresh install
